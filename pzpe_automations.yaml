# -----------------------------------------------------------------------------
# WR50114 — Nastavení sezóny (0=Topná sezóna, 1=Léto)
# -----------------------------------------------------------------------------

- id: pzpe_wr50114_zapis
  alias: PZPE, zápis do registru WR50114
  description: Při změně input_select zapíše odpovídající číselnou hodnotu (0/1) do TČ
  triggers:
  - platform: state
    entity_id: input_select.pzpe_is_wr50114_sezona
  conditions:
  - condition: template
    value_template: >
      {% set mapa = {'Topná sezóna': 0, 'Léto': 1} %}
      {{ mapa[states('input_select.pzpe_is_wr50114_sezona')]
         != states('sensor.pzpe_hreg_rw_wr50114_sezona')|int(0) }}
  actions:
  - service: modbus.write_register
    data:
      hub: pzpe
      address: 50114
      slave: 1
      value: >
        {% set mapa = {'Topná sezóna': 0, 'Léto': 1} %}
        {{ mapa[states('input_select.pzpe_is_wr50114_sezona')] }}
  mode: single

- id: pzpe_wr50114_sync
  alias: PZPE, sync WR50114 z TČ do input_select
  description: Při změně sensoru WR50114 nastaví input_select dle hodnoty registru
  triggers:
  - platform: state
    entity_id: sensor.pzpe_hreg_rw_wr50114_sezona
  - platform: homeassistant
    event: start
  conditions:
  - condition: template
    value_template: >
