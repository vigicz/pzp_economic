# =============================================================================
# PZP/Kermi tepelné čerpadlo — Automatizace
# =============================================================================

# -----------------------------------------------------------------------------
# WR50005 — obousměrná synchronizace bitového registru
# -----------------------------------------------------------------------------

- id: pzpe_wr50005_zapis
  alias: PZPE, zápis do registru WR50005
  description: Při změně jakéhokoli WR50005 bitu zapíše novou dekadickou hodnotu do TČ
  triggers:
  - platform: state
    entity_id:
    - input_boolean.pzpe_ib_wr50005_bit0_rezim_tc
    - input_boolean.pzpe_ib_wr50005_bit1_obecny_pozadavek
    - input_boolean.pzpe_ib_wr50005_bit2_regbod_topeni
    - input_boolean.pzpe_ib_wr50005_bit3_hystereze_topeni
    - input_boolean.pzpe_ib_wr50005_bit4_regbod_chlazeni
    - input_boolean.pzpe_ib_wr50005_bit5_hystereze_chlazeni
    - input_boolean.pzpe_ib_wr50005_bit6_sezona
    - input_boolean.pzpe_ib_wr50005_bit7_hdo
    - input_boolean.pzpe_ib_wr50005_bit8_provozni_rezim
  # Hodnota se skládá přímo z input_boolean, ne ze sensor.pzpe_tpl_wr50005_hodnota:
  # template sensor se v okamžiku spuštění automatizace ještě nemusí přepočítat,
  # pak se zápis přeskočí nebo zapíše předchozí hodnotu a sync z TČ ji vrátí
  # zpět do input_boolean – vznikne smyčka zápis ↔ sync v rytmu čtení Modbusu.
  # Krátká pauza + mode: restart sloučí dávku změn (sync nastavuje bity postupně).
  # Bez podmínky „liší se od registru“: sensor registru se obnoví až dalším čtením
  # Modbusu, takže by rychlé přepnutí tam a zpět přeskočil. Zápis stejné hodnoty
  # nic nezmění a sync nespustí.
  actions:
  - delay:
      seconds: 1
  - variables:
      val: >-
        {{ (is_state('input_boolean.pzpe_ib_wr50005_bit0_rezim_tc', 'on') | int * 1)
        + (is_state('input_boolean.pzpe_ib_wr50005_bit1_obecny_pozadavek', 'on') | int * 2)
        + (is_state('input_boolean.pzpe_ib_wr50005_bit2_regbod_topeni', 'on') | int * 4)
        + (is_state('input_boolean.pzpe_ib_wr50005_bit3_hystereze_topeni', 'on') | int * 8)
        + (is_state('input_boolean.pzpe_ib_wr50005_bit4_regbod_chlazeni', 'on') | int * 16)
        + (is_state('input_boolean.pzpe_ib_wr50005_bit5_hystereze_chlazeni', 'on') | int * 32)
        + (is_state('input_boolean.pzpe_ib_wr50005_bit6_sezona', 'on') | int * 64)
        + (is_state('input_boolean.pzpe_ib_wr50005_bit7_hdo', 'on') | int * 128)
        + (is_state('input_boolean.pzpe_ib_wr50005_bit8_provozni_rezim', 'on') | int * 256) }}
  - action: modbus.write_register
    data:
      hub: pzpe
      address: 50005
      slave: 1
      value: "{{ val | int }}"
  mode: restart

- id: pzpe_wr50005_sync
  alias: PZPE, sync WR50005 z TČ do input_boolean
  description: Při změně sensoru WR50005 nastaví jednotlivé input_boolean dle bitů
  triggers:
  - platform: state
    entity_id: sensor.pzpe_hreg_rw_wr50005
  - platform: homeassistant
    event: start
  conditions:
  - condition: template
    value_template: >
      {{ states('sensor.pzpe_hreg_rw_wr50005') not in ['unknown', 'unavailable'] }}
  actions:
  - variables:
      val: "{{ states('sensor.pzpe_hreg_rw_wr50005') | int(0) }}"
  # bit 0
  - action: >
      {{ 'input_boolean.turn_on' if (val | int | bitwise_and(1)) > 0 else 'input_boolean.turn_off' }}
    target:
      entity_id: input_boolean.pzpe_ib_wr50005_bit0_rezim_tc
  # bit 1
  - action: >
      {{ 'input_boolean.turn_on' if (val | int | bitwise_and(2)) > 0 else 'input_boolean.turn_off' }}
    target:
      entity_id: input_boolean.pzpe_ib_wr50005_bit1_obecny_pozadavek
  # bit 2
  - action: >
      {{ 'input_boolean.turn_on' if (val | int | bitwise_and(4)) > 0 else 'input_boolean.turn_off' }}
    target:
      entity_id: input_boolean.pzpe_ib_wr50005_bit2_regbod_topeni
  # bit 3
  - action: >
      {{ 'input_boolean.turn_on' if (val | int | bitwise_and(8)) > 0 else 'input_boolean.turn_off' }}
    target:
      entity_id: input_boolean.pzpe_ib_wr50005_bit3_hystereze_topeni
  # bit 4
  - action: >
      {{ 'input_boolean.turn_on' if (val | int | bitwise_and(16)) > 0 else 'input_boolean.turn_off' }}
    target:
      entity_id: input_boolean.pzpe_ib_wr50005_bit4_regbod_chlazeni
  # bit 5
  - action: >
      {{ 'input_boolean.turn_on' if (val | int | bitwise_and(32)) > 0 else 'input_boolean.turn_off' }}
    target:
      entity_id: input_boolean.pzpe_ib_wr50005_bit5_hystereze_chlazeni
  # bit 6
  - action: >
      {{ 'input_boolean.turn_on' if (val | int | bitwise_and(64)) > 0 else 'input_boolean.turn_off' }}
    target:
      entity_id: input_boolean.pzpe_ib_wr50005_bit6_sezona
  # bit 7
  - action: >
      {{ 'input_boolean.turn_on' if (val | int | bitwise_and(128)) > 0 else 'input_boolean.turn_off' }}
    target:
      entity_id: input_boolean.pzpe_ib_wr50005_bit7_hdo
  # bit 8
  - action: >
      {{ 'input_boolean.turn_on' if (val | int | bitwise_and(256)) > 0 else 'input_boolean.turn_off' }}
    target:
      entity_id: input_boolean.pzpe_ib_wr50005_bit8_provozni_rezim
  mode: restart

