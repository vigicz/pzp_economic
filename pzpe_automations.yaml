# -----------------------------------------------------------------------------
# Ohlášení nadřazeného řízení — nutné pro fungování externího řízení TČ
# -----------------------------------------------------------------------------

- id: pzpe_ohlaseni_nadrazeneho_rizeni
  alias: PZPE, ohlášení nadřazeného řízení (každou minutu)
  description: >
    Přepíná coil WC50001 každou minutu přímým zápisem přes Modbus.
    TČ tak ví, že nadřazený systém je aktivní (watchdog).
  triggers:
  - trigger: time_pattern
    minutes: /1
  actions:
  - action: modbus.write_coil
    data:
      hub: pzpe
      slave: 1
      address: 50001
      state: >
        {{ not is_state('binary_sensor.pzpe_coil_rw_wc50001_ohlaseni', 'on') }}
  mode: single
