# =============================================================================
# PZP/Kermi tepelné čerpadlo — Helpery (input_boolean)
# =============================================================================

input_boolean:

  # -------------------------------------------------------------------------
  # WR50005 — bitové povolení nadřazeného řízení (addr 50005)
  # Každý input_boolean = 1 bit registru. Obousměrná synchronizace
  # s TČ zajištěna automatizacemi v pzpe_automations.yaml.
  # -------------------------------------------------------------------------

  # bit 0 (hodnota 1) — Povolení režimu TČ (Topení/Chlazení), coil 50002
  pzpe_ib_wr50005_bit0_rezim_tc:
    name: "WR50005 bit0: Režim TČ (Topení/Chlazení)"

  # bit 1 (hodnota 2) — Povolení aktivace obecného požadavku na provoz, coil 50003
  pzpe_ib_wr50005_bit1_obecny_pozadavek:
    name: "WR50005 bit1: Obecný požadavek na provoz"

  # bit 2 (hodnota 4) — Povolení nastavení reg. bodu topení, reg. 50100
  pzpe_ib_wr50005_bit2_regbod_topeni:
    name: "WR50005 bit2: Reg. bod topení"

  # bit 3 (hodnota 8) — Povolení nastavení hystereze reg. bodu topení, reg. 50101
  pzpe_ib_wr50005_bit3_hystereze_topeni:
    name: "WR50005 bit3: Hystereze reg. bodu topení"

  # bit 4 (hodnota 16) — Povolení nastavení reg. bodu chlazení, reg. 50102
  pzpe_ib_wr50005_bit4_regbod_chlazeni:
    name: "WR50005 bit4: Reg. bod chlazení"

  # bit 5 (hodnota 32) — Povolení nastavení hystereze reg. bodu chlazení, reg. 50103
  pzpe_ib_wr50005_bit5_hystereze_chlazeni:
    name: "WR50005 bit5: Hystereze reg. bodu chlazení"

  # bit 6 (hodnota 64) — Povolení nastavení sezóny (Léto/Zima), reg. 50114
  pzpe_ib_wr50005_bit6_sezona:
    name: "WR50005 bit6: Sezóna (Léto/Zima)"

  # bit 7 (hodnota 128) — Povolení řízení HDO, coil 50033
  pzpe_ib_wr50005_bit7_hdo:
    name: "WR50005 bit7: Řízení HDO"

  # bit 8 (hodnota 256) — Povolení řízení provozního režimu, reg. 50115
  pzpe_ib_wr50005_bit8_provozni_rezim:
    name: "WR50005 bit8: Provozní režim (Sleep/Demo/Auto/Test/Service)"

  # -------------------------------------------------------------------------
  # WR50015 — bitové povolení řízení teplé vody (addr 50015)
  # Každý input_boolean = 1 bit registru. Obousměrná synchronizace
  # s TČ zajištěna automatizacemi v pzpe_automations.yaml.
  # -------------------------------------------------------------------------

  # bit 0 (hodnota 1) — Povolení nastavení reg. bodu teplé vody, reg. 50108
  pzpe_ib_wr50015_bit0_regbod_tv:
    name: "WR50015 bit0: Reg. bod teplé vody"

  # bit 1 (hodnota 2) — Povolení nastavení hystereze reg. bodu teplé vody, reg. 50109
  pzpe_ib_wr50015_bit1_hystereze_tv:
    name: "WR50015 bit1: Hystereze reg. bodu teplé vody"

  # bit 2 (hodnota 4) — Povolení funkce blokování přípravy teplé vody, coil 50010
  pzpe_ib_wr50015_bit2_blokovani_pripravy_tv:
    name: "WR50015 bit2: Blokování přípravy teplé vody"

  # bit 3 (hodnota 8) — Povolení funkce blokování dohřevu teplé vody, coil 50011
  pzpe_ib_wr50015_bit3_blokovani_dohrevu_tv:
    name: "WR50015 bit3: Blokování dohřevu teplé vody"

  # -------------------------------------------------------------------------
  # WR50050 — bitové povolení funkcí kompresoru a ventilátoru (addr 50050)
  # Každý input_boolean = 1 bit registru. Obousměrná synchronizace
  # s TČ zajištěna automatizacemi v pzpe_automations.yaml.
  # -------------------------------------------------------------------------

  # bit 0 (hodnota 1) — Povolení řízení kompresoru, coil 50023
  pzpe_ib_wr50050_bit0_rizeni_kompresoru:
    name: "WR50050 bit0: Řízení kompresoru"

  # bit 1 (hodnota 2) — Povolení blokování provozu kompresoru, coil 50024
  pzpe_ib_wr50050_bit1_blokovani_kompresoru:
    name: "WR50050 bit1: Blokování kompresoru"

  # bit 2 (hodnota 4) — Povolení vypnutí anticyklické ochrany kompresoru, coil 50032
  pzpe_ib_wr50050_bit2_anticyklicka_ochrana:
    name: "WR50050 bit2: Vypnutí anticyklické ochrany"

  # bit 8 (hodnota 256) — Povolení řízení útlumu ventilátoru, coil 50025
  pzpe_ib_wr50050_bit8_utlum_ventilatoru:
    name: "WR50050 bit8: Útlum ventilátoru"

  # bit 9 (hodnota 512) — Povolení řízení odtávání reverzací, reg 15116
  pzpe_ib_wr50050_bit9_odtavani_reverzaci:
    name: "WR50050 bit9: Odtávání reverzací"

  # -------------------------------------------------------------------------
  # WR50055 — bitové povolení funkcí elektrokotle (addr 50055)
  # Každý input_boolean = 1 bit registru. Obousměrná synchronizace
  # s TČ zajištěna automatizacemi v pzpe_automations.yaml.
  # -------------------------------------------------------------------------

  # bit 0 (hodnota 1) — Povolení řízení elektrokotle, coil 50026
  pzpe_ib_wr50055_bit0_rizeni_elektrokotle:
    name: "WR50055 bit0: Řízení elektrokotle"

  # bit 1 (hodnota 2) — Povolení nastavení počtu stupňů elektrokotle, reg. 50113
  pzpe_ib_wr50055_bit1_stupne_elektrokotle:
    name: "WR50055 bit1: Počet stupňů elektrokotle"

  # bit 2 (hodnota 4) — Povolení funkce blokování provozu elektrokotle, coil 50029
  pzpe_ib_wr50055_bit2_blokovani_elektrokotle:
    name: "WR50055 bit2: Blokování elektrokotle"

  # bit 3 (hodnota 8) — Povolení řízení topnic elektrokotle, coil 50027 + 50028
  pzpe_ib_wr50055_bit3_topnice_elektrokotle:
    name: "WR50055 bit3: Řízení topnic elektrokotle"

# =============================================================================
# Input number (číselné nastavení)
# =============================================================================

input_number:

  # WR50101 — Hystereze regulačního bodu topení (addr 50101, /10)
  pzpe_in_wr50101_hystereze_topeni:
    name: "WR50101: Hystereze reg. bodu topení"
    min: 0.1
    max: 20.0
    step: 0.1
    unit_of_measurement: '°C'

  # WR50109 — Hystereze regulačního bodu teplé vody (addr 50109, /10)
  pzpe_in_wr50109_hystereze_tv:
    name: "WR50109: Hystereze reg. bodu TV"
    min: 0.1
    max: 20.0
    step: 0.1
    unit_of_measurement: '°C'

# =============================================================================
# Input select (výběr ze tří a více možností)
# =============================================================================

input_select:

  # WR50114 — Nastavení sezóny (addr 50114)
  # 0=Topná sezóna, 1=Léto
  pzpe_is_wr50114_sezona:
    name: "WR50114: Sezóna"
    options:
      - "Topná sezóna"
      - "Léto"
    initial: "Topná sezóna"

  # WR50115 — Nastavení provozního režimu (addr 50115)
  # 0=Sleep, 1=Demo, 2=Auto, 3=Test, 4=Service
  pzpe_is_wr50115_provozni_rezim:
    name: "WR50115: Provozní režim"
    options:
      - "Sleep"
      - "Demo"
      - "Auto"
      - "Test"
      - "Service"
    initial: "Auto"

  # WR50116 — Režim odtávání reverzací výparníku 1 (addr 50116)
  # 0=Automaticky, 1=Zapnout, 2=Vypnout
  pzpe_is_wr50116_odtavani_reverzaci:
    name: "WR50116: Režim odtávání reverzací"
    options:
      - "Automaticky"
      - "Zapnout"
      - "Vypnout"
    initial: "Automaticky"

