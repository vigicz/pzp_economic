# =============================================================================
# PZP/Kermi tepelné čerpadlo — Helpery (input_boolean)
# =============================================================================

input_boolean:

  # -------------------------------------------------------------------------
  # WR50005 — bitové povolení nadřazeného řízení (addr 50005)
  # Každý input_boolean = 1 bit registru. Obousměrná synchronizace
  # s TČ zajištěna automatizacemi v pzpe_automations.yaml.
  # -------------------------------------------------------------------------

  # bit 0 (hodnota 1) — Povolení režimu TČ (Topení/Chlazení), coil 50002
  pzpe_ib_wr50005_bit0_rezim_tc:
    name: "WR50005 bit0: Režim TČ (Topení/Chlazení)"

  # bit 1 (hodnota 2) — Povolení aktivace obecného požadavku na provoz, coil 50003
  pzpe_ib_wr50005_bit1_obecny_pozadavek:
    name: "WR50005 bit1: Obecný požadavek na provoz"

  # bit 2 (hodnota 4) — Povolení nastavení reg. bodu topení, reg. 50100
  pzpe_ib_wr50005_bit2_regbod_topeni:
    name: "WR50005 bit2: Reg. bod topení"

  # bit 3 (hodnota 8) — Povolení nastavení hystereze reg. bodu topení, reg. 50101
  pzpe_ib_wr50005_bit3_hystereze_topeni:
    name: "WR50005 bit3: Hystereze reg. bodu topení"

  # bit 4 (hodnota 16) — Povolení nastavení reg. bodu chlazení, reg. 50102
  pzpe_ib_wr50005_bit4_regbod_chlazeni:
    name: "WR50005 bit4: Reg. bod chlazení"

  # bit 5 (hodnota 32) — Povolení nastavení hystereze reg. bodu chlazení, reg. 50103
  pzpe_ib_wr50005_bit5_hystereze_chlazeni:
    name: "WR50005 bit5: Hystereze reg. bodu chlazení"

  # bit 6 (hodnota 64) — Povolení nastavení sezóny (Léto/Zima), reg. 50114
  pzpe_ib_wr50005_bit6_sezona:
    name: "WR50005 bit6: Sezóna (Léto/Zima)"

  # bit 7 (hodnota 128) — Povolení řízení HDO, coil 50033
  pzpe_ib_wr50005_bit7_hdo:
    name: "WR50005 bit7: Řízení HDO"

  # bit 8 (hodnota 256) — Povolení řízení provozního režimu, reg. 50115
  pzpe_ib_wr50005_bit8_provozni_rezim:
    name: "WR50005 bit8: Provozní režim (Sleep/Demo/Auto/Test/Service)"

  # -------------------------------------------------------------------------
  # WR50015 — bitové povolení řízení teplé vody (addr 50015)
  # Každý input_boolean = 1 bit registru. Obousměrná synchronizace
  # s TČ zajištěna automatizacemi v pzpe_automations.yaml.
  # -------------------------------------------------------------------------

  # bit 0 (hodnota 1) — Povolení nastavení reg. bodu teplé vody, reg. 50108
  pzpe_ib_wr50015_bit0_regbod_tv:
    name: "WR50015 bit0: Reg. bod teplé vody"

  # bit 1 (hodnota 2) — Povolení nastavení hystereze reg. bodu teplé vody, reg. 50109
  pzpe_ib_wr50015_bit1_hystereze_tv:
    name: "WR50015 bit1: Hystereze reg. bodu teplé vody"

  # bit 2 (hodnota 4) — Povolení funkce blokování přípravy teplé vody, coil 50010
  pzpe_ib_wr50015_bit2_blokovani_pripravy_tv:
    name: "WR50015 bit2: Blokování přípravy teplé vody"

  # bit 3 (hodnota 8) — Povolení funkce blokování dohřevu teplé vody, coil 50011
  pzpe_ib_wr50015_bit3_blokovani_dohrevu_tv:
    name: "WR50015 bit3: Blokování dohřevu teplé vody"

