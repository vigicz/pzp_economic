# ---------------------------------------------------------------------------
# CLIMATES (modbus climate — čtení + zápis)
# ---------------------------------------------------------------------------
climates:

  # Regulační bod teplé vody — čtení B12 (addr 105), zápis WR50108 (addr 50108)
  - name: pzpe_climate_rw_regbod_tv
    unique_id: pzpe_climate_rw_regbod_tv
    address: 105
    input_type: holding
    data_type: int16
    min_temp: 20
    max_temp: 70
    offset: 0
    precision: 1
    scale: 0.1
    target_temp_register: 50108
    target_temp_write_registers: true
    temp_step: 1
    temperature_unit: C

  # Regulační bod topení — čtení B11 (addr 104), zápis WR50100 (addr 50100)
  - name: pzpe_climate_rw_regbod_topeni
    unique_id: pzpe_climate_rw_regbod_topeni
    address: 104
    input_type: holding
    data_type: int16
    min_temp: 15
    max_temp: 35
    offset: 0
    precision: 1
    scale: 0.1
    target_temp_register: 50100
    target_temp_write_registers: true
    temp_step: 1
    temperature_unit: C
