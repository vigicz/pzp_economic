# =============================================================================
# PZP/Kermi tepelné čerpadlo — Modbus konfigurace
# Hub: pzpe | TCP 192.168.30.101:502
# =============================================================================

type: tcp
host: 192.168.30.101
port: 502
name: pzpe
delay: 0
timeout: 5
scan_interval: 10

